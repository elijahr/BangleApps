<html>

<head>
    <link rel="stylesheet" href="../../css/spectre.min.css">
</head>

<body>
    <h3>GlucoSee Settings</h3>

    <!-- form switch control -->
    <div class="form-group">
        <label class="form-switch">
            <input type="checkbox">
            <i class="form-icon"></i> Some setting
        </label>
    </div>

    <hr/>

    <h3>Debugging</h3>

    <div class="form-group">
        <code> id="data" data-lang="json"></code>
        <button id="load" class="btn btn-primary">Load glucosee.data.json</button>
        <button id="erase" class="btn btn-error">Erase glucosee.data.json</button>
    </div>

    <script src="../../core/lib/interface.js"></script>

    <script>
        function loadData(callback) {
            try {
                Util.readStorage("glucosee.data.json", rawData => {
                    var prettyData;
                    try {
                        var obj = JSON.loads(rawData);
                        prettyData = JSON.stringify(obj, space=4);
                    } catch (e) {
                        console.error("(Warning) Could not parse file contents.");
                        prettyData = rawData;
                    }
                    document.getElementById("data").innerHTML = prettyData;
                    console.log("Loaded data from Bangle.js.");
                    if (callback) callback(rawData);
                });
            } catch (e) {
                console.error("(Warning) Could not load file from Bangle.js.");
                console.error(e);
                if (callback) callback();
            }
        }

        function eraseData(callback) {
            try {
                Util.eraseStorageFle("glucosee.data.json", () => {
                    console.log("Erased glucosee.data.json.");
                    loadData();
                });
            } catch (e) {
                console.error("(Warning) Could not erase file on Bangle.js.");
                console.error(e);
            }
            if (callback) callback();
        }

        function onInit() {
            loadData();
        }

        document.getElementById("load").addEventListener("click", function () {
            Util.showModal("Loading...");
            loadData(() => {
                Util.hideModal();
            });
        });

        document.getElementById("load").addEventListener("click", function () {
            Util.showModal("Erasing...");
            eraseData(() => {
                Util.hideModal();
            });
        });
    </script>
</body>

</html>
